name: PoseNy
options:
  bundleIdPrefix: com.poseny
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PoseNy:
    type: application
    platform: iOS
    sources:
      - path: PoseNy
    info:
      path: PoseNy/Info.plist
      properties:
        CFBundleDisplayName: PoseNy
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "PoseNy cần camera để hiển thị khung dáng mẫu và nhận diện tư thế khi chụp."
        NSPhotoLibraryAddUsageDescription: "PoseNy cần quyền lưu những bức ảnh bạn chụp vào thư viện Ảnh."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.poseny.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Điền Team ID của bạn (Xcode > Settings > Accounts) để chạy trên iPhone thật
        DEVELOPMENT_TEAM: ""
schemes:
  PoseNy:
    build:
      targets:
        PoseNy: all
    run:
      config: Debug
    archive:
      config: Release
